; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = micro_ros_ping

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB
monitor_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB
lib_deps =
    file://lib/micro_ros_platformio
build_flags =
    -Ilib/micro_ros_platformio/platform_code
    -Ilib/micro_ros_platformio/platform_code/arduino/serial
    -Ilib/micro_ros_platformio/libmicroros/include

[env:vida_firmware]
build_src_filter =
    -<*>
    +<src/*.cpp>
board_microros_transport = serial

[env:micro_ros_ping]
build_src_filter =
    -<*>
    +<src/micro_ros_ping.cpp>
board_microros_transport = serial

[env:steering_sensor]
build_src_filter =
    -<*>
    +<debug/steering/steering_sensor.cpp>
    +<src/SteeringSensor.cpp>

[env:steering_motor]
build_src_filter =
    -<*>
    +<debug/steering/steering_motor.cpp>
    +<src/SteeringMotor.cpp>
