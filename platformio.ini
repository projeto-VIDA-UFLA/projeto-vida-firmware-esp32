; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = vida_firmware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB
monitor_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB

[env:vida_firmware]
build_src_filter =
    -<*>
    +<src/*.cpp>

[env:steering_sensor]
build_src_filter =
    -<*>
    +<debug/steering/steering_sensor.cpp>
    +<src/SteeringSensor.cpp>

[env:steering_motor]
build_src_filter =
    -<*>
    +<debug/steering/steering_motor.cpp>
    +<src/SteeringMotor.cpp>

[env:encoder_teste]
build_src_filter =
    -<*>
    +<debug/encoder/encoder_teste.cpp>
    +<src/EncoderReader.cpp>
board_microros_transport = serial
board_microros_distro = humble
