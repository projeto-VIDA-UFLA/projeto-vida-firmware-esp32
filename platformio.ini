; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = vida_firmware

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600 ; = SERIAL_BAUDRATE (micro-ROS)
board_microros_transport = serial
board_microros_distro = humble
upload_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB
monitor_port = /dev/vida_esp32 ;comente essa linha para autoscanear a porta USB

[env:vida_firmware]
build_src_filter =
    -<*>
    +<src/*.cpp>
    +<src/sensors/*.cpp>
    +<src/actuators/*.cpp>
    +<src/safety/*.cpp>
    +<src/control/*.cpp>
    +<src/comunication/*.cpp>
    +<main/main.cpp>


[env:vida_tests]
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<src/actuators/*.cpp>
    +<src/safety/SafetyWatchdogs.cpp>
